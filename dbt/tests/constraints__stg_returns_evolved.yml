version: 2
models:
  - name: stg_returns_evolved
    config:
      contract:
        enforced: true
    columns:
      - name: return_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
      - name: order_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: product_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: return_ts
        data_type: timestamp
        constraints:
          - type: not_null
      - name: qty
        data_type: integer
        constraints:
          - type: not_null
      - name: reason
        data_type: varchar
      - name: return_reason_code
        data_type: varchar
      - name: quality_checks
        data_type: varchar