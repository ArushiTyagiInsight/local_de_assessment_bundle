version: 2
models:
  - name: stg_orders_lines
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: line_number
        data_type: bigint
        constraints:
          - type: not_null
      - name: product_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: quantity
        data_type: integer
        constraints:
          - type: not_null
          - type: check
            expression: "quantity > 0"
            error_message: "Invalid quantity"
      - name: unit_price_usd
        data_type: decimal(10,2)
        constraints:
          - type: not_null
          - type: check
            expression: "unit_price_usd >= 0"
            error_message: "Negative unit price"
      - name: line_discount_pct
        data_type: decimal(10,2)
        constraints:
          - type: check
            expression: "line_discount_pct >= 0 AND line_discount_pct <= 100"
            error_message: "Discount percentage must be between 0 and 100"
      - name: tax_pct
        data_type: decimal(10,2)
        constraints:
          - type: check
            expression: "tax_pct >= 0 AND tax_pct <= 100"
            error_message: "Tax percentage must be between 0 and 100"
      - name: discount_amount_usd
        data_type: decimal(10,2)
        constraints:
          - type: not_null
          - type: check
            expression: "discount_amount_usd >= 0"
            error_message: "Negative discount amount"
      - name: line_total_usd
        data_type: decimal(10,2)
        constraints:
          - type: not_null
          - type: check
            expression: "line_total_usd >= 0"
            error_message: "Negative line total"
      - name: quality_checks
        data_type: varchar