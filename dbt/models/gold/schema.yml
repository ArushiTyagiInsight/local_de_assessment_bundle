version: 2

models:
  - name: fct_sensor_readings
    description: Gold layer fact table for hourly sensor readings with statistics and anomaly detection
    config:
      materialized: table
      tags: ['gold', 'fact', 'sensors']
      contract:
        enforced: true
    columns:
      - name: reading_hour
        description: Hour bucket for aggregated readings
        data_type: timestamptz
        tests:
          - not_null
      - name: store_id
        description: Foreign key to stores
        data_type: bigint
        tests:
          - not_null
      - name: shelf_id
        description: Shelf identifier within store
        data_type: varchar
      - name: readings_count
        description: Number of readings in the hour
        data_type: bigint
        tests:
          - not_null
          - positive_value
      - name: avg_temperature_c
        description: Average temperature in Celsius for the hour
        data_type: decimal(5,2)
      - name: avg_humidity_pct
        description: Average humidity percentage for the hour
        data_type: decimal(5,2)
      - name: avg_battery_mv
        description: Average battery level in millivolts
        data_type: decimal(10,2)
      - name: min_temperature_c
        description: Minimum temperature in Celsius
        data_type: decimal(5,2)
      - name: max_temperature_c
        description: Maximum temperature in Celsius
        data_type: decimal(5,2)
      - name: min_humidity_pct
        description: Minimum humidity percentage
        data_type: decimal(5,2)
      - name: max_humidity_pct
        description: Maximum humidity percentage
        data_type: decimal(5,2)
      - name: rolling_24h_avg_temp
        description: 24-hour rolling average temperature
        data_type: decimal(5,2)
      - name: rolling_24h_avg_humidity
        description: 24-hour rolling average humidity
        data_type: decimal(5,2)
      - name: is_temperature_anomaly
        description: Flag indicating temperature outside normal range
        data_type: boolean
        tests:
          - not_null
      - name: is_humidity_anomaly
        description: Flag indicating humidity outside normal range
        data_type: boolean
        tests:
          - not_null
      - name: temperature_status
        description: Status indicator for temperature readings
        data_type: varchar
      - name: humidity_status
        description: Status indicator for humidity readings
        data_type: varchar
      - name: gold_created_ts
        description: Timestamp when the record was created in gold layer
        data_type: timestamptz
        tests:
          - not_null

  - name: fct_shipments
    description: Fact table for shipment tracking and delivery SLA analysis
    config:
      materialized: table
      tags: ['gold', 'fact', 'shipping']
    columns:
      # Keys
      - name: shipment_id
        description: Unique identifier for the shipment (derived from order_id)
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to dim_customer
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: store_id
        description: Foreign key to dim_store
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_id

      # Timestamps
      - name: shipment_ts_utc
        description: Shipment timestamp in UTC
        tests:
          - not_null
      - name: shipment_dt_local
        description: Local date of shipment
        tests:
          - not_null
      - name: shipment_year
        description: Year of shipment
      - name: shipment_month
        description: Month of shipment (1-12)
      - name: shipment_day_of_week
        description: Day of week (0-6)

      # Delivery Details
      - name: delivery_channel
        description: Channel through which order was delivered
        tests:
          - accepted_values:
              values: ['web', 'mobile', 'store']

      # Measures
      - name: shipping_cost
        description: Cost of shipping in USD
        tests:
          - not_null
          - positive
      - name: delivery_days
        description: Actual number of days taken for delivery
        tests:
          - not_null
          - positive
      - name: expected_delivery_days
        description: Expected delivery days based on channel SLA
        tests:
          - not_null
          - positive

      # SLA Metrics
      - name: on_time_flag
        description: Flag indicating if delivery met SLA (Y/N)
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: sla_compliant
        description: Binary indicator for SLA compliance (1=compliant, 0=non-compliant)
        tests:
          - accepted_values:
              values: [0, 1]
      - name: days_overdue
        description: Number of days delivery exceeded SLA (0 if on time)
        tests:
          - positive

      # Quality Tracking
      - name: has_quality_issues
        description: Flag indicating presence of data quality issues
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: all_quality_checks
        description: Details of any quality issues identified

      # Metadata
      - name: processed_ts
        description: Timestamp when record was processed
        tests:
          - not_null
  - name: fct_sales
    description: Fact table containing all sales transactions at the order line level
    config:
      materialized: table
      tags: ['gold', 'fact', 'sales']
    columns:
      # Degenerate Dimensions
      - name: order_number
        description: Order identifier
        tests:
          - not_null
      - name: line_item_number
        description: Line item number within the order
        tests:
          - not_null

      # Foreign Keys
      - name: customer_id
        description: Foreign key to dim_customer
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        description: Foreign key to dim_product
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: store_id
        description: Foreign key to dim_store
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_id

      # Date/Time Attributes
      - name: order_ts_utc
        description: Order timestamp in UTC
        tests:
          - not_null
      - name: order_dt_local
        description: Local date of the order
        tests:
          - not_null
      - name: order_year
        description: Year of order
      - name: order_month
        description: Month of order (1-12)
      - name: order_day
        description: Day of month
      - name: order_day_of_week
        description: Day of week (0-6)

      # Channel and Payment
      - name: channel
        description: Sales channel (web, mobile, store)
        tests:
          - accepted_values:
              values: ['web', 'mobile', 'store']
      - name: payment_method
        description: Method of payment
        tests:
          - not_null
      
      # Order Attributes
      - name: coupon_code
        description: Coupon code applied to the order, if any
      - name: currency_code
        description: Currency code for the transaction
        tests:
          - not_null
          - accepted_values:
              values: ['USD', 'AUD', 'EUR', 'GBP']

      # Measures
      - name: quantity
        description: Number of items ordered
        tests:
          - not_null
          - positive
      - name: unit_price
        description: Price per unit in USD
        tests:
          - not_null
          - positive
      - name: gross_amount
        description: Total amount before discounts and tax (quantity × unit_price)
        tests:
          - not_null
      - name: discount_amount
        description: Total discount applied to the line
        tests:
          - not_null
      - name: tax_amount
        description: Total tax applied to the line
        tests:
          - not_null
      - name: net_amount
        description: Amount after discounts but before tax
        tests:
          - not_null
      - name: line_total
        description: Final line amount including discounts and tax
        tests:
          - not_null
      
      # Percentages
      - name: discount_percentage
        description: Discount percentage applied
        tests:
          - range_check:
              min_value: 0
              max_value: 100
      - name: tax_percentage
        description: Tax percentage applied
        tests:
          - range_check:
              min_value: 0
              max_value: 100

      # Quality Flags
      - name: has_quality_issues
        description: Flag indicating presence of data quality issues
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: all_quality_checks
        description: Details of any quality issues identified
  - name: dim_customer
    description: Customer dimension with privacy controls and derived attributes
    config:
      materialized: table
      tags: ['gold', 'dimension', 'customer']
    columns:
      - name: customer_sk
        description: Surrogate key for customer dimension
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural key from source
        tests:
          - not_null
      - name: customer_name
        description: Customer full name (masked if no GDPR consent)
      - name: email
        description: Email address (hashed if no GDPR consent)
      - name: phone
        description: Phone number (masked if no GDPR consent)
      - name: address
        description: Street address (generalized to city if no GDPR consent)
      - name: city
        description: City name
      - name: state
        description: State/province
      - name: country
        description: Country
      - name: postal_code
        description: Postal code (masked if no GDPR consent)
      - name: customer_age
        description: Calculated customer age
      - name: customer_lifetime_days
        description: Days since first order
      - name: customer_segment
        description: Customer segment based on VIP status and join date
      - name: gdpr_consent
        description: Flag indicating GDPR consent status
      - name: is_active
        description: Current activity status
      - name: join_date
        description: Date customer joined
      - name: last_order_date
        description: Date of most recent order
  # Dimension Tables
  - name: dim_product
    description: Type 2 SCD product dimension with historical tracking
    config:
      materialized: table
      tags: ['gold', 'dimension', 'product']
    columns:
      - name: product_sk
        description: Surrogate key for product dimension
        tests:
          - unique
          - not_null
      - name: product_id
        description: Natural key from source
        tests:
          - not_null
      - name: product_name
        description: Current product name
      - name: category
        description: Product category
      - name: subcategory
        description: Product subcategory
      - name: unit_price
        description: Current unit price
      - name: effective_from
        description: When this version became active
        tests:
          - not_null
      - name: effective_to
        description: When this version was superseded
      - name: is_current
        description: Flag for current version
        tests:
          - not_null
      - name: price_change_flag
        description: Indicates if price changed from previous version
      - name: days_in_catalog
        description: Number of days product has been in catalog
      - name: product_status
        description: Current product status (Active/Discontinued/Out of Stock)

  - name: dim_store
    description: Store dimension with derived attributes
    config:
      materialized: table
      tags: ['gold', 'dimension', 'store']
    columns:
      - name: store_sk
        description: Surrogate key for store dimension
        tests:
          - unique
          - not_null
      - name: store_id
        description: Natural key from source
        tests:
          - not_null
      - name: store_name
        description: Store name
      - name: store_type
        description: Type of store
      - name: region
        description: Store region
      - name: country
        description: Store country
      - name: store_status
        description: Operational status
      - name: days_operating
        description: Number of days store has been operating
      - name: store_size_category
        description: Size category based on floor space
      - name: latitude
        description: Store latitude
      - name: longitude
        description: Store longitude

  - name: dim_supplier
    description: Supplier dimension with performance metrics
    config:
      materialized: table
      tags: ['gold', 'dimension', 'supplier']
    columns:
      - name: supplier_sk
        description: Surrogate key for supplier dimension
        tests:
          - unique
          - not_null
      - name: supplier_id
        description: Natural key from source
        tests:
          - not_null
      - name: supplier_name
        description: Supplier name
      - name: supplier_category
        description: Supplier category
      - name: country
        description: Supplier country
      - name: region
        description: Geographical region
      - name: supplier_tier
        description: Performance tier (Preferred/Standard)
      - name: lead_time_category
        description: Lead time classification
      - name: active_products_count
        description: Count of active products from supplier

  - name: dim_date
    description: Date dimension with calendar and fiscal attributes
    config:
      materialized: table
      tags: ['gold', 'dimension', 'date']
    columns:
      - name: date_sk
        description: Surrogate key (YYYYMMDD format)
        tests:
          - unique
          - not_null
      - name: date_day
        description: Date in DATE format
        tests:
          - unique
          - not_null
      - name: day_name
        description: Name of day (Monday, Tuesday, etc.)
      - name: day_of_week
        description: Day number of week (1-7)
      - name: day_of_month
        description: Day number of month (1-31)
      - name: day_of_year
        description: Day number of year (1-366)
      - name: week_of_year
        description: ISO week number (1-53)
      - name: month_name
        description: Month name (January, February, etc.)
      - name: month_number
        description: Month number (1-12)
      - name: quarter_number
        description: Quarter number (1-4)
      - name: year_number
        description: Year (YYYY)
      - name: fiscal_month
        description: Fiscal month number
      - name: fiscal_quarter
        description: Fiscal quarter number
      - name: fiscal_year
        description: Fiscal year
      - name: is_weekend
        description: Weekend indicator (True/False)
      - name: is_holiday
        description: Holiday indicator (True/False)
      - name: holiday_name
        description: Name of holiday if applicable

  # Fact Tables
  
  - name: fct_returns
    description: Return facts with enriched customer and product dimensions. Each record represents a product return event.
    config:
      tags: ['gold', 'fact']
    columns:
      - name: return_id
        description: Unique identifier for the return
        tests:
          - unique
          - not_null
      
      - name: order_number
        description: Reference to the original order
        tests:
          - not_null
      
      - name: product_id
        description: Foreign key to dim_product_scd
        tests:
          - not_null
          - relationships:
              to: ref('dim_product_scd')
              field: product_id
      
      - name: customer_id
        description: Foreign key to dim_customer
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      
      - name: store_id
        description: Foreign key to dim_store
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_id
      
      - name: return_ts
        description: Timestamp when the return was processed (UTC)
        tests:
          - not_null
      
      - name: return_date
        description: Date when the return was processed (local)
        tests:
          - not_null
      
      - name: return_year
        description: Year of return
        tests:
          - not_null
      
      - name: return_month
        description: Month of return
        tests:
          - not_null
      
      - name: order_ts_utc
        description: Original order timestamp (UTC)
        tests:
          - not_null
      
      - name: order_dt_local
        description: Original order date (local)
        tests:
          - not_null
      
      - name: return_quantity
        description: Number of units returned
        tests:
          - not_null
          - positive_values
      
      - name: reason
        description: Detailed return reason provided by customer
      
      - name: return_reason_code
        description: Standardized return reason code
        tests:
          - accepted_values:
              values: ['DEF', 'SIZE', 'STYLE', 'LATE', 'OTHER']
      
      - name: reason_category
        description: Business-friendly categorization of return reasons
        tests:
          - accepted_values:
              values: ['Defective', 'Wrong Size', 'Style/Preference', 'Late Delivery', 'Other', 'Unknown']
      
      - name: order_channel
        description: Channel through which the original order was placed
        tests:
          - accepted_values:
              values: ['web', 'mobile', 'store']
      
      - name: return_value
        description: Estimated value of returned items in USD
        tests:
          - not_null
      
      - name: days_to_return
        description: Number of days between order and return
        tests:
          - not_null
          - positive_values
      
      - name: return_timeframe
        description: Categorization of return timing
        tests:
          - accepted_values:
              values: ['Within 7 days', 'Within 14 days', 'Within 30 days', 'Over 30 days']
      
      - name: has_quality_issues
        description: Flag indicating if data quality issues were detected
        tests:
          - not_null
      
      - name: all_quality_checks
        description: Details of any quality checks that failed