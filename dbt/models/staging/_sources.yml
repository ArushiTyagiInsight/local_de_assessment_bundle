version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: customers_parquet
        description: Raw customers data from parquet files
        columns:
          - name: customer_id
            description: Unique identifier for each customer
            tests:
              - unique
              - not_null
          - name: natural_key
            description: Natural business key for the customer
            tests:
              - not_null
          - name: email
            description: Customer's email address
            tests:
              - not_null
          - name: first_name
            description: Customer's first name
          - name: last_name
            description: Customer's last name
          - name: phone
            description: Customer's phone number
          - name: address_line1
            description: Primary address line
          - name: address_line2
            description: Secondary address line
          - name: city
            description: City name
          - name: state_region
            description: State or region
          - name: postcode
            description: Postal code
          - name: country_code
            description: Two-letter country code
          - name: latitude
            description: Location latitude
          - name: longitude
            description: Location longitude
          - name: birth_date
            description: Customer's date of birth
          - name: join_ts
            description: Timestamp when customer joined
          - name: is_vip
            description: Whether the customer has VIP status
          - name: gdpr_consent
            description: Whether customer has given GDPR consent