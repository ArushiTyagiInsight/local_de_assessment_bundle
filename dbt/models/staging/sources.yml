version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: exchange_rates
        description: Exchange rates data from the bronze layer
        columns:
          - name: date
            description: The date of the exchange rate
            tests:
              - not_null
          - name: currency
            description: The currency code
            tests:
              - not_null
          - name: rate_to_aud
            description: Exchange rate to AUD
            tests:
              - not_null
              - positive_value

      - name: sensors
        description: IoT sensor data from stores
        columns:
          - name: sensor_ts
            description: Timestamp of the sensor reading
          - name: store_id
            description: Store identifier
            tests:
              - not_null
          - name: shelf_id
            description: Shelf identifier
          - name: temperature_c
            description: Temperature in Celsius
          - name: humidity_pct
            description: Humidity percentage
          - name: battery_mv
            description: Battery level in millivolts