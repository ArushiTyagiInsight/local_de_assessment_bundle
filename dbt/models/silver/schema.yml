version: 2

models:
  - name: fact_order_lines
    description: Silver layer fact table combining order header and line item details
    config:
      tags: ['silver', 'orders', 'fact']
    columns:
      - name: order_id
        description: Foreign key to orders
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: line_number
        description: Line item number within the order
        tests:
          - not_null
      - name: product_id
        description: Foreign key to products
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: customer_id
        description: Foreign key to customers
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: store_id
        description: Foreign key to stores
        tests:
          - not_null
      - name: order_ts_utc
        description: Order timestamp in UTC
        tests:
          - not_null
      - name: order_dt_local
        description: Local date of the order
        tests:
          - not_null
      - name: channel
        description: Sales channel (web, mobile, store)
        tests:
          - accepted_values:
              values: ['web', 'mobile', 'store']
      - name: payment_method
        description: Method of payment
        tests:
          - not_null
      - name: coupon_code
        description: Coupon code applied to the order, if any
      - name: currency_code
        description: Currency code for the order
        tests:
          - not_null
          - accepted_values:
              values: ['USD', 'AUD', 'EUR', 'GBP']
      - name: quantity
        description: Quantity ordered
        tests:
          - not_null
          - positive
      - name: unit_price_usd
        description: Unit price in USD
        tests:
          - not_null
          - positive
      - name: line_discount_pct
        description: Discount percentage applied to line
        tests:
          - range_check:
              min_value: 0
              max_value: 100
      - name: tax_pct
        description: Tax percentage applied to line
        tests:
          - range_check:
              min_value: 0
              max_value: 100
      - name: discount_amount_usd
        description: Calculated discount amount in USD
        tests:
          - not_null
          - positive
      - name: line_total_usd
        description: Total amount for line item in USD (including tax, after discount)
        tests:
          - not_null
          - positive
      - name: shipping_fee_usd
        description: Shipping fee in USD for the order
        tests:
          - positive
      - name: has_quality_issues
        description: Flag indicating presence of quality issues (Y/N)
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: all_quality_checks
        description: Concatenated list of all quality check failures
  - name: fact_returns_base
    description: Silver layer fact table for base returns data
    config:
      tags: ['silver', 'returns', 'fact']
    columns:
      - name: return_id
        description: Primary key for returns
        tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to orders
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: product_id
        description: Foreign key to products
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: return_ts
        description: Timestamp of the return
        tests:
          - not_null
      - name: return_date
        description: Date of return (truncated from timestamp)
        tests:
          - not_null
      - name: qty
        description: Quantity returned
        tests:
          - not_null
          - positive
      - name: estimated_return_value_usd
        description: Calculated return value based on order amount and quantity
      - name: processed_ts
        description: Processing timestamp for the record
        tests:
          - not_null

  - name: fact_returns_evolved
    description: Silver layer fact table for evolved returns data with additional fields and quality checks
    config:
      tags: ['silver', 'returns', 'fact']
    columns:
      - name: return_id
        description: Primary key for returns
        tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to orders
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: product_id
        description: Foreign key to products
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: return_ts
        description: Timestamp of the return
        tests:
          - not_null
      - name: return_date
        description: Date of return (truncated from timestamp)
        tests:
          - not_null
      - name: qty
        description: Quantity returned
        tests:
          - not_null
          - positive
      - name: reason
        description: Text description of return reason
      - name: return_reason_code
        description: Standardized code for return reason
      - name: reason_category
        description: Categorized return reason
        tests:
          - accepted_values:
              values: ['Defective', 'Wrong Size', 'Style/Preference', 'Late Delivery', 'Other', 'Unknown']
      - name: estimated_return_value_usd
        description: Calculated return value based on order amount and quantity
      - name: quality_checks
        description: Concatenated list of quality check failures
      - name: processed_ts
        description: Processing timestamp for the record
        tests:
          - not_null

  - name: products
    description: Silver layer enriched products dimension
    config:
      tags: ['silver', 'products', 'dimension']
    columns:
      - name: product_id
        description: Primary key for products
        tests:
          - unique
          - not_null
      - name: product_status
        description: Derived status (Active/Discontinued/Out of Stock)
        tests:
          - accepted_values:
              values: ['Active', 'Discontinued', 'Out of Stock']
      - name: days_in_catalog
        description: Number of days product has been in catalog
        tests:
          - not_null

  - name: stores
    description: Silver layer enriched stores dimension
    config:
      tags: ['silver', 'stores', 'dimension']
    columns:
      - name: store_id
        description: Primary key for stores
        tests:
          - unique
          - not_null
      - name: store_status
        description: Current store status
        tests:
          - accepted_values:
              values: ['Active', 'Closed']
      - name: days_operating
        description: Total days store has been operating
        tests:
          - not_null

  - name: suppliers
    description: Silver layer enriched suppliers dimension
    config:
      tags: ['silver', 'suppliers', 'dimension']
    columns:
      - name: supplier_id
        description: Primary key for suppliers
        tests:
          - unique
          - not_null
      - name: supplier_tier
        description: Supplier categorization
        tests:
          - accepted_values:
              values: ['Preferred', 'Standard']
      - name: lead_time_category
        description: Categorized lead time
        tests:
          - accepted_values:
              values: ['Fast', 'Medium', 'Slow']

  - name: exchange_rates
    description: Silver layer enriched exchange rates with trends
    config:
      tags: ['silver', 'exchange_rates', 'dimension']
    columns:
      - name: date
        description: Rate date
        tests:
          - not_null
      - name: currency
        description: Currency code
        tests:
          - not_null
      - name: rate_to_aud
        description: Exchange rate to AUD
        tests:
          - not_null
          - positive_values

  - name: fact_sensors
    description: Silver layer fact table for sensor readings with data quality checks
    config:
      tags: ['silver', 'sensors', 'fact']
      contract:
        enforced: true
    columns:
      - name: sensor_ts
        description: Timestamp of the sensor reading
        data_type: timestamptz
        tests:
          - not_null
      - name: store_id
        description: Foreign key to stores
        data_type: bigint
        tests:
          - not_null
      - name: shelf_id
        description: Shelf identifier within store
        data_type: varchar
      - name: temperature_c
        description: Temperature reading in Celsius
        data_type: decimal(5,2)
      - name: humidity_pct
        description: Humidity reading in percentage
        data_type: decimal(5,2)
      - name: battery_mv
        description: Battery level in millivolts
        data_type: integer
      - name: is_valid_reading
        description: Flag indicating if reading passed quality checks
        data_type: boolean
        tests:
          - not_null
      - name: dbt_created_ts
        description: Timestamp when record was created in staging
        data_type: timestamptz
      - name: silver_created_ts
        description: Timestamp when record was created in silver
        data_type: timestamptz

  - name: fact_returns
    description: Fact table for product returns with schema evolution support
    config:
      tags: ['fact', 'returns', 'incremental']
    columns:
      - name: return_id
        description: Primary key for return records
        tests:
          - not_null
          - unique
      - name: order_id
        description: Foreign key to orders
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: product_id
        description: Foreign key to products
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: return_ts
        description: When the return was processed
        tests:
          - not_null
      - name: qty
        description: Quantity returned
        tests:
          - not_null
          - positive_values
      - name: reason
        description: Return reason description
        tests:
          - not_null
      - name: return_reason_code
        description: Standardized return reason code (added in v2)
      - name: return_date
        description: Extracted date of return
        tests:
          - not_null
      - name: return_month
        description: Month number of return
        tests:
          - not_null
      - name: return_year
        description: Year of return
        tests:
          - not_null
      - name: is_bulk_return
        description: Flag for returns with quantity > 10
        tests:
          - not_null
      - name: data_quality_check
        description: Any data quality issues found

  - name: fact_shipments
    description: Fact table for shipment tracking with incremental processing
    config:
      tags: ['fact', 'shipments', 'incremental']
    columns:
      - name: shipment_id
        description: Primary key for shipment records
        tests:
          - not_null
          - unique
      - name: order_id
        description: Foreign key to orders
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: carrier
        description: Shipping carrier name
        tests:
          - not_null
      - name: shipped_at
        description: When the shipment was picked up
        tests:
          - not_null
      - name: delivered_at
        description: When the shipment was delivered (null if in transit)
      - name: ship_cost
        description: Cost of shipping
        tests:
          - not_null
          - positive_values
      - name: delivery_duration_days
        description: Number of days between shipment and delivery
      - name: is_late_delivery
        description: Flag indicating if delivery exceeded 7-day SLA
      - name: shipment_status
        description: Current status of the shipment
        tests:
          - accepted_values:
              values: ['DELIVERED', 'IN_TRANSIT', 'UNKNOWN']
      - name: data_quality_check
        description: Any data quality issues found